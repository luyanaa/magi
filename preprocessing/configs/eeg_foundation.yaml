# EEG Foundation Preprocessing Config
# Matches field standard: filter + resample + normalize + mask bad data
# No ICA/ASR (clinical-grade repair available in eeg_clinical.yaml)

pipeline: foundation
device: cpu
batch_size: 32

resample:
  target_sfreq: 256
  method: torchaudio

filter:
  bandpass: [0.1, 100.0]
  notch: [50, 60]
  method: fir
  fir_design: firwin
  numtaps: 101

reference: average

quality:
  bad_channel_corr_threshold: 0.1
  bad_channel_var_min: 1.0e-6
  bad_channel_var_max_factor: 100.0
  artifact_z_threshold: 5.0
  min_good_channels: 4

artifact_handling:
  mode: mask

normalization:
  method: zscore
  per_channel: true

montage:
  target: standard_1020
  virtual_montage: true
  idw_k: 4

output:
  format: both
  save_format: npy
  save_quality_report: true
